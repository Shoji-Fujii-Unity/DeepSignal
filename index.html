<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DEEP SIGNAL</title>
<style>
  :root {
    --fg:#c8f2ff;
    --dim:#6f9db1;
    --accent:#2ee6ff;
    --danger:#ff5566;
    --bg:#000308;
  }

  * { box-sizing:border-box; }

  html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Meiryo,"Noto Sans JP",Arial,sans-serif;
    -webkit-user-select:none;
    user-select:none;
    overscroll-behavior:none;
  }

  canvas {
    display:block;
    position:fixed;
    inset:0;
    touch-action:none;
    background:#000;
  }

  .hidden { display:none !important; }

  #rotate {
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    background:#000;
    text-align:center;
    padding:24px;
  }

  @media (orientation:portrait) {
    #rotate { display:flex; }
  }

  #rotate .rot {
    width:96px;
    height:64px;
    border:2px solid var(--accent);
    border-radius:12px;
    position:relative;
    animation:rotHint 2s infinite;
  }

  #rotate .rot:after {
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    top:24px;
    height:2px;
    background:var(--accent);
  }

  @keyframes rotHint {
    0%,100% { transform:rotate(0deg); }
    50% { transform:rotate(90deg); }
  }

  #ui {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
  }

  .topBar {
    position:fixed;
    left:0;
    top:0;
    right:0;
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    z-index:40;
    pointer-events:none;
    text-shadow:0 0 8px #000;
    font-size:12px;
  }

  .topLeft {
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  #title {
    color:var(--accent);
    font-weight:700;
    letter-spacing:0.22em;
    font-size:14px;
  }

  #tag {
    color:var(--dim);
    font-size:10px;
  }

  .topRight {
    display:flex;
    gap:8px;
    align-items:center;
    pointer-events:auto;
  }

  #stats {
    color:var(--dim);
    font-size:10px;
    min-width:120px;
    text-align:right;
  }

  .status {
    position:fixed;
    left:12px;
    top:42px;
    z-index:35;
    font-size:12px;
    color:#8fd7ff;
    pointer-events:none;
    white-space:nowrap;
    text-shadow:0 0 8px #000;
    letter-spacing:0.04em;
  }

  .val {
    color:var(--accent);
    font-weight:700;
  }

  #noiseBar {
    width:130px;
    height:6px;
    border:1px solid rgba(46,230,255,.45);
    margin-top:4px;
    background:rgba(0,20,35,.55);
    overflow:hidden;
  }
  #noiseFill {
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#084c66,#2ee6ff);
  }

  #log {
    position:fixed;
    left:12px;
    bottom:12px;
    width:min(360px, 52vw);
    max-height:120px;
    overflow:hidden;
    z-index:35;
    pointer-events:none;
    font-size:11px;
    line-height:1.35;
    color:#83aabd;
    text-shadow:0 0 6px #000;
  }

  #log div {
    margin-bottom:2px;
    opacity:.85;
  }

  #pulseBtn {
    position:fixed;
    right:max(18px, env(safe-area-inset-right));
    bottom:max(18px, env(safe-area-inset-bottom));
    width:108px;
    height:108px;
    border-radius:50%;
    border:1px solid rgba(46,230,255,.72);
    background:radial-gradient(circle at 35% 35%, rgba(46,230,255,.26), rgba(0,20,35,.82));
    color:var(--accent);
    font-weight:800;
    font-size:16px;
    letter-spacing:.12em;
    box-shadow:0 0 24px rgba(46,230,255,.18), inset 0 0 22px rgba(46,230,255,.1);
    z-index:45;
    pointer-events:auto;
    touch-action:none;
    cursor:pointer;
  }

  #pulseBtn:active {
    transform:scale(.95);
    box-shadow:0 0 36px rgba(46,230,255,.38), inset 0 0 28px rgba(46,230,255,.22);
  }

  .overlay {
    position:fixed;
    inset:0;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,4,9,.92);
    padding:18px;
    text-align:center;
    pointer-events:auto;
  }

  .panel {
    width:min(760px, 96vw);
    max-height:86vh;
    overflow:auto;
    border:1px solid rgba(46,230,255,.28);
    background:rgba(0,12,22,.86);
    padding:18px;
    box-shadow:0 0 34px rgba(46,230,255,.09);
  }

  .gameTitle {
    color:var(--accent);
    font-size:clamp(24px, 5vw, 42px);
    letter-spacing:.24em;
    margin:0 0 4px;
    text-shadow:0 0 24px rgba(46,230,255,.26);
  }

  .gameSub {
    color:#8fd7ff;
    margin:0 0 14px;
    font-size:13px;
  }

  .small {
    color:var(--dim);
    font-size:11px;
    margin:10px 0;
  }

  .row {
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:12px 0;
  }

  button {
    appearance:none;
    border:1px solid rgba(46,230,255,.62);
    background:rgba(0,28,45,.88);
    color:var(--fg);
    padding:10px 14px;
    border-radius:6px;
    font:inherit;
    cursor:pointer;
    letter-spacing:.06em;
    min-height:40px;
  }

  button:hover { background:rgba(0,50,80,.9); }
  button:active { transform:translateY(1px); }

  select {
    appearance:none;
    border:1px solid rgba(46,230,255,.48);
    background:rgba(0,28,45,.88);
    color:var(--fg);
    padding:10px;
    border-radius:6px;
    font:inherit;
  }

  .info {
    text-align:left;
    margin:14px auto;
    border:1px solid rgba(46,230,255,.18);
    padding:12px;
    background:rgba(0,18,30,.55);
    font-size:12px;
    line-height:1.5;
    color:#b8e7ff;
  }

  .endStats {
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    margin:14px 0;
    color:#9fe8ff;
    font-size:13px;
  }

  .danger { color:var(--danger); }

  #soundBtn {
    min-width:86px;
    font-size:11px;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="rotate">
  <div class="rot"></div>
  <div data-i18n="rotate" style="color:#8fd7ff;font-weight:700;letter-spacing:.14em"></div>
</div>

<div id="ui">
  <div class="topBar">
    <div class="topLeft">
      <div id="title" data-i18n="title"></div>
      <div id="tag" data-i18n="tag"></div>
    </div>

    <div class="topRight">
      <div id="stats"></div>
      <button id="soundBtn" data-i18n="soundOn"></button>
    </div>
  </div>

  <div class="status">
    <div>
      <span data-i18n="depth"></span>: <span class="val" id="depthVal">0</span>m
    </div>
    <div>
      <span data-i18n="hull"></span>: <span class="val" id="hullVal">100</span>%
    </div>
    <div>
      <span data-i18n="noise"></span>: <span class="val" id="noiseVal">0</span>%
      <div id="noiseBar"><div id="noiseFill"></div></div>
    </div>
    <div>
      <span data-i18n="time"></span>: <span class="val" id="timeVal">0:00</span>
    </div>
  </div>

  <div id="log"></div>

  <button id="pulseBtn" data-i18n="pulse"></button>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1 class="gameTitle" data-i18n="title"></h1>
    <div class="gameSub" data-i18n="tag"></div>

    <div class="row">
      <select id="langSelect"></select>
    </div>

    <div class="row">
      <button id="startBtn" data-i18n="start"></button>
      <button id="continueBtn" class="hidden" data-i18n="cont"></button>
    </div>

    <div class="info">
      <div data-i18n="objective"></div>
      <br>
      <div data-i18n="controls"></div>
      <div data-i18n="ctrl"></div>
      <div class="small">Three.js / WebAudio / localStorage</div>
    </div>
  </div>
</div>

<div id="end" class="overlay hidden">
  <div class="panel">
    <h1 class="gameTitle" id="endTitle"></h1>

    <div class="endStats">
      <div>
        <span data-i18n="end_depth"></span>:
        <span class="val" id="endDepthVal">0</span>m
      </div>
      <div>
        <span data-i18n="end_time"></span>:
        <span class="val" id="endTimeVal">0:00</span>
      </div>
    </div>

    <div class="row">
      <button id="restartBtn" data-i18n="restart"></button>
      <button id="menuBtn" data-i18n="menu"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

      objective:"목표: 조용히 3200m로 하강. 시야 없음. 소리로 지형을 읽는다.",

    },
    es:{

      tag:"HORROR SONAR",
      rotate:"Gira a horizontal",

      ctrl:"Arrastra para pilotar / PULSE para sonar. Teclado: flechas + espacio.",
      objective:"Objetivo: desciende en silencio a 3200m. Sin visión. Lee el terreno con sonido.",
      depth:"PROFUNDIDAD",

  };

  const LANGS = [
    ["ja","日本語"],
    ["en","English"],
    ["zh","中文 (Simplified)"],
    ["ko","한국어"],
    ["es","Español"]
  ];

  let dom;
  let renderer, scene, camera, clock;
  let material, uniforms;
  let terrainMesh;
  let rockMesh;
  let rockData = [];
  let creatures = [];
  let pulseVisuals = [];
  let playerMesh;

  const player = {
    pos: new THREE.Vector3(0,0,0),
    radius: PLAYER_RADIUS
  };

  const state = {
    playing:false,
    hull:100,
    depth:0,
    elapsed:0,
    noise:0,
    log:[],
    lang:"ja",
    sound:true,
    endWin:false
  };

  const input = { x:0, y:0, mag:0 };
  const keys = {};
  let activePointer = null;
  const dragOrigin = { x:0, y:0 };

  let pulses = [];
  let lastPulseTime = -999;
  let lastWallHit = -999;
  let nextMilestone = 500;
  let lastCreatureLog = -999;
  let lastSave = 0;

  let audioCtx = null;
  let masterGain = null;
  let moveGain = null;
  let movePanner = null;

  const tmpV = new THREE.Vector3();
  const tmpV2 = new THREE.Vector3();
  const tmpV3 = new THREE.Vector3();
  const tmpM = new THREE.Matrix4();
  const tmpQ = new THREE.Quaternion();
  const tmpS = new THREE.Vector3();
  const tmpE = new THREE.Euler();

  function t(key){
    if (I18N[state.lang] && I18N[state.lang][key]) return I18N[state.lang][key];
    if (I18N.en && I18N.en[key]) return I18N.en[key];
    return key;
  }

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c => {
      if(c==="&") return "&amp;";
      if(c==="<") return "&lt;";
      if(c===">") return "&gt;";
      if(c==="\"") return "&quot;";
      return "&#39;";
    });
  }

  function formatTime(sec){
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ":" + String(s).padStart(2,"0");
  }

  function readSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || typeof data !== "object") return null;
      return data;
    }catch(e){
      return null;
    }
  }

  function writeSave(){
    try{
      const data = {
        depth: Math.floor(clamp(state.depth,0,TARGET_DEPTH)),
        log: state.log.slice(-40),
        lang: state.lang
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    }catch(e){}
  }

  function loadSavedToState(){
    const saved = readSave();
    if (saved){
      if (I18N[saved.lang]) state.lang = saved.lang;
      state.depth = Number(saved.depth) || 0;
      state.log = Array.isArray(saved.log) ? saved.log.slice(-40) : [];
    } else {
      const nav = (navigator.language || "en").slice(0,2);
      if (I18N[nav]) state.lang = nav;
    }
  }

  function applyLang(){
    if (!I18N[state.lang]) state.lang = "ja";
    document.documentElement.lang = state.lang;
    document.title = t("title") + " / " + t("tag");

    document.querySelectorAll("[data-i18n]").forEach(node=>{
      node.textContent = t(node.getAttribute("data-i18n"));
    });

    if (dom.soundBtn) {
      dom.soundBtn.textContent = state.sound ? t("soundOn") : t("soundOff");
    }

    if (dom.langSelect) dom.langSelect.value = state.lang;

    if (dom.end && !dom.end.classList.contains("hidden")) {
      dom.endTitle.textContent = state.endWin ? t("end_win") : t("end_lose");
      dom.endTitle.classList.toggle("danger", !state.endWin);
    }

    renderLogs();
  }

  function renderLogs(){
    if (!dom.log) return;
    const list = state.log.slice(-10);
    dom.log.innerHTML = list.map(line => "<div>&gt; " + escapeHTML(line) + "</div>").join("");
  }

  function addLog(text){
    if (!text) return;
    state.log.push(String(text));
    if (state.log.length > 60) state.log.shift();
    renderLogs();
  }

  function updateHUD(){
    dom.depthVal.textContent = Math.max(0, Math.floor(state.depth));
    dom.hullVal.textContent = Math.max(0, Math.floor(state.hull));
    dom.noiseVal.textContent = Math.floor(clamp(state.noise,0,1) * 100);
    dom.noiseFill.style.width = Math.floor(clamp(state.noise,0,1)*100) + "%";
    dom.timeVal.textContent = formatTime(state.elapsed);
  }

  function mulberry32(a){
    return function(){
      a |= 0;
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function tubeRadius(z, angle){
    let r = TUBE_RADIUS;
    r += 5.0 * Math.sin(z * 0.004 + angle * 2.0);
    r += 3.0 * Math.sin(z * 0.011 - angle * 3.0 + Math.cos(z * 0.0035));
    r += 2.0 * Math.sin(z * 0.021 + Math.cos(angle * 5.0));
    return Math.max(TUBE_RADIUS * 0.62, r);
  }

  function initDom(){
    dom = {
      canvas: document.getElementById("game"),
      menu: document.getElementById("menu"),
      end: document.getElementById("end"),
      rotate: document.getElementById("rotate"),
      langSelect: document.getElementById("langSelect"),
      startBtn: document.getElementById("startBtn"),
      continueBtn: document.getElementById("continueBtn"),
      soundBtn: document.getElementById("soundBtn"),
      pulseBtn: document.getElementById("pulseBtn"),
      restartBtn: document.getElementById("restartBtn"),
      menuBtn: document.getElementById("menuBtn"),
      log: document.getElementById("log"),
      depthVal: document.getElementById("depthVal"),
      hullVal: document.getElementById("hullVal"),
      noiseVal: document.getElementById("noiseVal"),
      noiseFill: document.getElementById("noiseFill"),
      timeVal: document.getElementById("timeVal"),
      stats: document.getElementById("stats"),
      endTitle: document.getElementById("endTitle"),
      endDepthVal: document.getElementById("endDepthVal"),
      endTimeVal: document.getElementById("endTimeVal")
    };
  }

  function setupMenu(){
    dom.langSelect.innerHTML = LANGS.map(x => {
      return '<option value="' + x[0] + '">' + x[1] + "</option>";
    }).join("");

    dom.langSelect.value = state.lang;

    const saved = readSave();
    const canContinue = !!(saved && saved.depth > 0 && saved.depth < TARGET_DEPTH);
    dom.continueBtn.classList.toggle("hidden", !canContinue);

    applyLang();
  }

  function showMenu(){
    state.playing = false;
    dom.end.classList.add("hidden");
    dom.menu.classList.remove("hidden");

    const saved = readSave();
    const canContinue = !!(saved && saved.depth > 0 && saved.depth < TARGET_DEPTH);
    dom.continueBtn.classList.toggle("hidden", !canContinue);

    applyLang();
    updateHUD();
  }

  function hideMenu(){
    dom.menu.classList.add("hidden");
    dom.end.classList.add("hidden");
  }

  function setSound(on){
    state.sound = !!on;
    if (masterGain) {
      masterGain.gain.value = state.sound ? 0.9 : 0.0;
    }
    applyLang();
    writeSave();
  }

  function ensureAudio(){
    if (audioCtx) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      return;
    }

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {
      return;
    }

    masterGain = audioCtx.createGain();
    masterGain.gain.value = state.sound ? 0.9 : 0.0;
    masterGain.connect(audioCtx.destination);

    const buffer = audioCtx.createBuffer(
      1,
      Math.floor(audioCtx.sampleRate * 2),
      audioCtx.sampleRate
    );
    const data = buffer.getChannelData(0);
    for (let i=0; i<data.length; i++) data[i] = Math.random() * 2 - 1;

    // Player movement noise
    moveGain = audioCtx.createGain();
    moveGain.gain.value = 0;

    movePanner = audioCtx.createPanner();
    configurePanner(movePanner);
    setPannerPos(movePanner, player.pos);

    const moveSrc = audioCtx.createBufferSource();
    moveSrc.buffer = buffer;
    moveSrc.loop = true;

    const moveFilter = audioCtx.createBiquadFilter();
    moveFilter.type = "lowpass";
    moveFilter.frequency.value = 320;

    moveSrc.connect(moveFilter);
    moveFilter.connect(moveGain);
    moveGain.connect(movePanner);
    movePanner.connect(masterGain);
    moveSrc.start();

    // Ambient deep-sea rumble
    const ambSrc = audioCtx.createBufferSource();
    ambSrc.buffer = buffer;
    ambSrc.loop = true;

    const ambGain = audioCtx.createGain();
    ambGain.gain.value = 0.022;

    const ambFilter = audioCtx.createBiquadFilter();
    ambFilter.type = "lowpass";
    ambFilter.frequency.value = 88;

    ambSrc.connect(ambFilter);
    ambFilter.connect(ambGain);
    ambGain.connect(masterGain);
    ambSrc.start();
  }

  function configurePanner(p){
    try {
      p.panningModel = "HRTF";
      p.distanceModel = "inverse";
      p.refDistance = 1;
      p.maxDistance = 1000;
      p.rolloffFactor = 1;
      p.coneInnerAngle = 360;
      p.coneOuterAngle = 360;
      p.coneOuterGain = 0;
    } catch(e){}
  }

  function setPannerPos(node, v){
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (node.positionX) {
      node.positionX.setValueAtTime(v.x, now);
      node.positionY.setValueAtTime(v.y, now);
      node.positionZ.setValueAtTime(v.z, now);
    } else if (node.setPosition) {
      node.setPosition(v.x, v.y, v.z);
    }
  }

  function updateListener(){
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const l = audioCtx.listener;

    if (l.positionX) {
      l.positionX.setValueAtTime(player.pos.x, now);
      l.positionY.setValueAtTime(player.pos.y, now);
      l.positionZ.setValueAtTime(player.pos.z, now);

      l.forwardX.setValueAtTime(0, now);
      l.forwardY.setValueAtTime(0, now);
      l.forwardZ.setValueAtTime(-1, now);

      l.upX.setValueAtTime(0, now);
      l.upY.setValueAtTime(1, now);
      l.upZ.setValueAtTime(0, now);
    } else if (l.setPosition) {
      l.setPosition(player.pos.x, player.pos.y, player.pos.z);
    }
  }

  function ping(pos){
    if (!audioCtx || !state.sound) return;

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1250, now);
    osc.frequency.exponentialRampToValueAtTime(165, now + 0.62);

    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 850;
    filter.Q.value = 1.1;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0, now);
    gain.gain.linearRampToValueAtTime(0.46, now + 0.018);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);

    const panner = audioCtx.createPanner();
    configurePanner(panner);
    setPannerPos(panner, pos);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(panner);
    panner.connect(masterGain);

    osc.start(now);
    osc.stop(now + 0.75);
  }

  function creatureSound(pos, intensity){
    if (!audioCtx || !state.sound) return;

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    osc.type = "sawtooth";

    const f0 = 110 + intensity * 130 + Math.random() * 90;
    osc.frequency.setValueAtTime(f0, now);
    osc.frequency.linearRampToValueAtTime(Math.max(40, f0 - 80), now + 0.55);

    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 700;
    filter.Q.value = 2.5;

    const gain = audioCtx.createGain();
    const peak = 0.05 + 0.10 * clamp(intensity, 0, 1);
    gain.gain.setValueAtTime(0.0, now);
    gain.gain.linearRampToValueAtTime(peak, now + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

    const panner = audioCtx.createPanner();
    configurePanner(panner);
    setPannerPos(panner, pos);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(panner);
    panner.connect(masterGain);

    osc.start(now);
    osc.stop(now + 0.85);
  }

  function updateAudio(){
    if (!audioCtx) return;
    updateListener();

    if (movePanner) setPannerPos(movePanner, player.pos);
    if (moveGain) {
      const g = state.playing ? Math.min(0.07, state.noise * 0.07) : 0;
      moveGain.gain.value = g;
    }
  }

  function makeShaderMaterial(){
    uniforms = {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0.22, 0.95, 1.0) },
      uSonarSpeed: { value: SONAR_SPEED },
      uMaxRadius: { value: SONAR_MAX },
      uPulsePos: {
        value: Array.from({length: MAX_PULSES}, () => new THREE.Vector3())
      },
      uPulseStart: {
        value: Array.from({length: MAX_PULSES}, () => 99999999)
      },
      uPulsePower: {
        value: Array.from({length: MAX_PULSES}, () => 0)
      }
    };

    const vertexShader = `
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;

      void main() {
        vec3 transformed = position;
        vec3 objectNormal = normal;

        #ifdef USE_INSTANCING
          transformed = (instanceMatrix * vec4(transformed, 1.0)).xyz;
          objectNormal = mat3(instanceMatrix) * objectNormal;
        #endif

        vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;

        #ifdef USE_INSTANCING
          vWorldNormal = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * objectNormal);
        #else
          vWorldNormal = normalize(mat3(modelMatrix) * objectNormal);
        #endif

        vec4 mvPosition;
        #ifdef USE_INSTANCING
          mvPosition = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
        #else
          mvPosition = modelViewMatrix * vec4(position, 1.0);
        #endif

        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fragmentShader = `
      uniform float uTime;
      uniform vec3 uColor;
      uniform float uSonarSpeed;
      uniform float uMaxRadius;

      uniform vec3 uPulsePos[${MAX_PULSES}];
      uniform float uPulseStart[${MAX_PULSES}];
      uniform float uPulsePower[${MAX_PULSES}];

      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;

      void main() {
        float reveal = 0.0;
        float thick2 = 320.0;

        vec3 n = vWorldNormal;
        if (dot(n, n) < 0.0001) {
          n = vec3(0.0, 1.0, 0.0);
        } else {
          n = normalize(n);
        }

        for (int i = 0; i < ${MAX_PULSES}; i++) {
          float power = uPulsePower[i];
          if (power <= 0.0) continue;

          float age = uTime - uPulseStart[i];
          float radius = uSonarSpeed * age;
          float maxAge = uMaxRadius / uSonarSpeed;

          if (age > 0.0 && age < maxAge) {
            vec3 p = uPulsePos[i];
            vec3 toSurface = vWorldPos - p;
            float dist = length(toSurface);

            float diff = dist - radius;
            float wave = exp(-(diff * diff) / thick2);

            if (wave > 0.008) {
              float atten = pow(clamp(1.0 - radius / uMaxRadius, 0.0, 1.0), 1.28);

              vec3 toSource = vec3(0.0, 1.0, 0.0);
              if (dist > 0.01) toSource = normalize(-toSurface);

              float facing = abs(dot(n, toSource));

              float viewTerm = 0.0;
              vec3 vdir = vWorldPos - cameraPosition;
              if (dot(vdir, vdir) > 0.001) {
                viewTerm = abs(dot(n, normalize(vdir)));
              }

              float shade = 0.16 + 0.64 * facing + 0.20 * viewTerm;
              reveal += wave * atten * shade * power;
            }
          }
        }

        if (reveal < 0.035) discard;

        float alpha = clamp(reveal, 0.0, 1.0);
        vec3 col = uColor * alpha;
        gl_FragColor = vec4(col, alpha);
      }
    `;

    material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
  }

  function createTunnel(){
    const radialSegments = 40;
    const heightSegments = 650;

    const geo = new THREE.CylinderGeometry(
      TUBE_RADIUS,
      TUBE_RADIUS,
      LEVEL_LENGTH,
      radialSegments,
      heightSegments,
      true
    );

    geo.rotateX(-Math.PI / 2);
    geo.translate(0, 0, -LEVEL_LENGTH / 2);

    const pos = geo.attributes.position;

    for (let i=0; i<pos.count; i++){
      const x = pos.getX(i);
      const y = pos.getY(i);
      const z = pos.getZ(i);

      const cr = Math.hypot(x, y);
      if (cr < 0.001) continue;

      const angle = Math.atan2(y, x);
      const nr = tubeRadius(z, angle);
      const s = nr / cr;

      pos.setX(i, x * s);
      pos.setY(i, y * s);
    }

    geo.computeVertexNormals();

    terrainMesh = new THREE.Mesh(geo, material);
    terrainMesh.frustumCulled = false;
    scene.add(terrainMesh);
  }

  function createRocks(){
    const rand = mulberry32(1337);

    const geo = new THREE.IcosahedronGeometry(1, 0);
    rockMesh = new THREE.InstancedMesh(geo, material, ROCK_COUNT);
    rockMesh.frustumCulled = false;

    for (let i=0; i<ROCK_COUNT; i++){
      const z = -180 - rand() * (TARGET_DEPTH + 120);
      const angle = rand() * Math.PI * 2;
      const maxRad = tubeRadius(z, angle) - 2.5;

      if (maxRad < 14) {
        tmpM.compose(
          tmpV.set(9999, 9999, 9999),
          tmpQ.identity(),
          tmpS.set(0.001,0.001,0.001)
        );
        rockMesh.setMatrixAt(i, tmpM);
        continue;
      }

      const rad = 14 + rand() * (maxRad - 14);
      const scale = 1.0 + rand() * 3.1;

      const pos = new THREE.Vector3(
        Math.cos(angle) * rad,
        Math.sin(angle) * rad,
        z
      );

      tmpE.set(rand()*Math.PI*2, rand()*Math.PI*2, rand()*Math.PI*2);
      tmpQ.setFromEuler(tmpE);
      tmpS.set(scale, scale * (0.55 + rand()*0.8), scale);

      tmpM.compose(pos, tmpQ, tmpS);
      rockMesh.setMatrixAt(i, tmpM);

      rockData.push({
        pos: pos.clone(),
        r: scale * 1.05,
        z: z
      });
    }

    rockMesh.instanceMatrix.needsUpdate = true;
    scene.add(rockMesh);
  }

  function createCreatures(){
    const rand = mulberry32(4242);
    const geo = new THREE.IcosahedronGeometry(1, 0);

    creatures.length = 0;

    for (let i=0; i<CREATURE_COUNT; i++){
      const z = -160 - rand() * (TARGET_DEPTH + 100);
      const angle = rand() * Math.PI * 2;
      const rad = rand() * (TUBE_RADIUS - 8);

      const pos = new THREE.Vector3(
        Math.cos(angle) * rad,
        Math.sin(angle) * rad,
        z
      );

      const mesh = new THREE.Mesh(geo, material);
      mesh.frustumCulled = false;
      mesh.scale.set(2.1, 1.55, 2.35);
      scene.add(mesh);

      const creature = {
        mesh,
        pos: pos.clone(),
        startPos: pos.clone(),
        vel: new THREE.Vector3(),
        radius: 2.2,
        aggro: 0,
        alertTarget: new THREE.Vector3(),
        hitCd: 0,
        cryCd: 0,
        soundLogCd: 0
      };

      creatures.push(creature);
    }
  }

  function createPlayerMesh(){
    const geo = new THREE.CylinderGeometry(0.85, 1.5, 4.6, 7, 1);
    geo.rotateX(-Math.PI / 2);

    const mat = new THREE.MeshBasicMaterial({
      color: 0x77e8ff,
      wireframe: true,
      transparent: true,
      opacity: 0.26,
      depthWrite: false
    });

    playerMesh = new THREE.Mesh(geo, mat);
    playerMesh.frustumCulled = false;
    scene.add(playerMesh);
  }

  function createPulseVisuals(){
    const geo = new THREE.IcosahedronGeometry(1, 0);
    const edges = new THREE.EdgesGeometry(geo);

    for (let i=0; i<MAX_PULSES; i++){
      const mat = new THREE.LineBasicMaterial({
        color: 0x3fd6ff,
        transparent: true,
        opacity: 0,
        depthWrite: false
      });

      const line = new THREE.LineSegments(edges, mat);
      line.frustumCulled = false;
      line.visible = false;
      scene.add(line);

      pulseVisuals.push(line);
    }
  }

  function clampTube(v, radius){
    const r = Math.hypot(v.x, v.y);
    if (r < 0.0001) return false;

    const angle = Math.atan2(v.y, v.x);
    const allowed = tubeRadius(v.z, angle) - radius;

    if (allowed < 0.1) {
      v.x = 0;
      v.y = 0;
      return true;
    }

    if (r > allowed) {
      const nx = v.x / r;
      const ny = v.y / r;
      v.x = nx * allowed;
      v.y = ny * allowed;
      return true;
    }

    return false;
  }

  function damage(amount, logKey){
    if (!state.playing) return;

    state.hull -= amount;
    addLog(t(logKey));

    if (state.hull <= 0) {
      state.hull = 0;
      endGame(false);
    }
  }

  function emitPulse(){
    if (!state.playing) return;
    if (!clock) return;

    const now = clock.getElapsedTime();
    if (now - lastPulseTime < PULSE_COOLDOWN) return;

    lastPulseTime = now;

    const pos = player.pos.clone();
    pulses.push({
      pos,
      start: now,
      power: 1.0
    });

    while (pulses.length > MAX_PULSES) pulses.shift();

    ensureAudio();
    ping(pos);

    state.noise = clamp(state.noise + 0.28, 0, 1);

    for (let i=0; i<creatures.length; i++){
      const c = creatures[i];
      const d = c.pos.distanceTo(pos);
      if (d < SONAR_MAX) {
        const k = 1 - d / SONAR_MAX;
        c.aggro = clamp(c.aggro + 0.42 * k, 0, 1);
        c.alertTarget.copy(pos);
      }
    }
  }

  function resetPulseVisuals(){
    pulses.length = 0;

    for (let i=0; i<MAX_PULSES; i++){
      uniforms.uPulsePower.value[i] = 0;
      uniforms.uPulseStart.value[i] = 99999999;
      uniforms.uPulsePos.value[i].set(0,0,0);
    }

    for (let i=0; i<pulseVisuals.length; i++){
      pulseVisuals[i].visible = false;
      pulseVisuals[i].material.opacity = 0;
    }
  }

  function resetCreatures(){
    for (let i=0; i<creatures.length; i++){
      const c = creatures[i];
      c.pos.copy(c.startPos);
      c.vel.set(0,0,0);
      c.aggro = 0;
      c.hitCd = 0;
      c.cryCd = 0;
      c.soundLogCd = 0;
      c.mesh.position.copy(c.pos);
    }
  }

  function startAt(depth){
    depth = Math.max(0, Math.min(depth, TARGET_DEPTH - 1));

    state.depth = depth;
    state.hull = 100;
    state.noise = 0;
    state.elapsed = 0;

    player.pos.set(0, 0, -depth);
    playerMesh.position.copy(player.pos);

    resetPulseVisuals();
    resetCreatures();

    nextMilestone = (Math.floor(depth / 500) + 1) * 500;
    if (nextMilestone <= depth) nextMilestone += 500;

    lastPulseTime = -999;
    lastWallHit = -999;
    lastCreatureLog = -999;

    camera.position.set(0, 7, player.pos.z + 16);
    camera.lookAt(0, 0, player.pos.z - 60);

    ensureAudio();
    state.playing = true;

    const now = clock ? clock.getElapsedTime() : 0;
    lastSave = now;

    writeSave();
    updateHUD();
  }

  function newGame(){
    state.log = [];
    renderLogs();
    hideMenu();
    addLog(t("log_start"));
    startAt(0);
  }

  function continueGame(){
    hideMenu();
    addLog(t("log_continue"));
    startAt(state.depth);
  }

  function endGame(win){
    if (!state.playing) return;

    state.playing = false;
    state.endWin = win;

    addLog(win ? t("log_win") : t("log_lose"));

    dom.endDepthVal.textContent = Math.floor(Math.min(state.depth, TARGET_DEPTH));
    dom.endTimeVal.textContent = formatTime(state.elapsed);

    dom.endTitle.textContent = win ? t("end_win") : t("end_lose");
    dom.endTitle.classList.toggle("danger", !win);

    dom.end.classList.remove("hidden");
    writeSave();
    updateHUD();
  }

  function updatePulseUniforms(now){
    for (let i=pulses.length-1; i>=0; i--){
      const age = now - pulses[i].start;
      if (age > SONAR_MAX / SONAR_SPEED) {
        pulses.splice(i,1);
      }
    }

    for (let i=0; i<MAX_PULSES; i++){
      if (i < pulses.length) {
        const p = pulses[i];
        uniforms.uPulsePos.value[i].copy(p.pos);
        uniforms.uPulseStart.value[i] = p.start;
        uniforms.uPulsePower.value[i] = p.power;
      } else {
        uniforms.uPulsePower.value[i] = 0;
        uniforms.uPulseStart.value[i] = 99999999;
      }
    }

    for (let i=0; i<pulseVisuals.length; i++){
      const line = pulseVisuals[i];

      if (i < pulses.length) {
        const p = pulses[i];
        const age = now - p.start;
        const r = Math.max(0.01, SONAR_SPEED * age);

        line.position.copy(p.pos);
        line.scale.setScalar(r);
        line.visible = true;
        line.material.opacity = 0.065 * clamp(1.0 - r / SONAR_MAX, 0, 1);
      } else {
        line.visible = false;
        line.material.opacity = 0;
      }
    }
  }

  function updateGame(dt, now){
    if (!state.playing) return;

    let ix = input.x;
    let iy = input.y;

    if (keys.ArrowLeft || keys.KeyA) ix -= 1;
    if (keys.ArrowRight || keys.KeyD) ix += 1;
    if (keys.ArrowUp || keys.KeyW) iy += 1;
    if (keys.ArrowDown || keys.KeyS) iy -= 1;

    ix = clamp(ix, -1, 1);
    iy = clamp(iy, -1, 1);

    const inMag = Math.min(1, Math.hypot(ix, iy));

    let targetNoise = inMag * 0.42;
    const pulseAge = now - lastPulseTime;
    if (pulseAge < 2.0) {
      targetNoise += 0.45 * (1 - pulseAge / 2.0);
    }

    state.noise = Math.min(
      1,
      Math.max(
        state.noise * Math.exp(-dt * 2.0),
        targetNoise
      )
    );

    player.pos.x += ix * STRAFE_SPEED * dt;
    player.pos.y += iy * STRAFE_SPEED * dt;
    player.pos.z -= FORWARD_SPEED * dt;

    playerMesh.position.copy(player.pos);
    playerMesh.rotation.z = -ix * 0.35;
    playerMesh.rotation.x = -iy * 0.18;

    state.depth = Math.max(0, -player.pos.z);
    state.elapsed += dt;

    if (state.depth >= TARGET_DEPTH) {
      endGame(true);
      return;
    }

    // Camera follow
    tmpV.set(
      player.pos.x * 0.34,
      player.pos.y * 0.34 + 7.0,
      player.pos.z + 16.0
    );
    camera.position.lerp(tmpV, Math.min(1, dt * 4.2));

    tmpV2.set(
      player.pos.x * 0.10,
      player.pos.y * 0.10,
      player.pos.z - 60.0
    );
    camera.lookAt(tmpV2);

    // Tube wall
    if (clampTube(player.pos, PLAYER_RADIUS)) {
      if (now - lastWallHit > 0.65) {
        damage(2.5, "log_wall");
        lastWallHit = now;
        if (!state.playing) return;
      }
    }

    // Rocks
    for (let i=0; i<rockData.length; i++){
      const r = rockData[i];
      if (Math.abs(player.pos.z - r.z) > 45) continue;

      const dx = player.pos.x - r.pos.x;
      const dy = player.pos.y - r.pos.y;
      const dz = player.pos.z - r.pos.z;
      const d2 = dx*dx + dy*dy + dz*dz;
      const rr = PLAYER_RADIUS + r.r;

      if (d2 < rr*rr) {
        const d = Math.max(0.001, Math.sqrt(d2));
        const nx = dx / d;
        const ny = dy / d;
        const nz = dz / d;
        const push = rr - d + 0.3;

        player.pos.x += nx * push;
        player.pos.y += ny * push;
        player.pos.z += nz * push * 0.25;

        damage(3.4, "log_rock");
        if (!state.playing) return;
      }
    }

    // Creatures
    const hearPlayerDist = 155 * Math.max(0, state.noise - 0.12);

    for (let i=0; i<creatures.length; i++){
      const c = creatures[i];

      c.aggro = Math.max(0, c.aggro - dt * 0.12);

      const distPlayer = c.pos.distanceTo(player.pos);

      if (hearPlayerDist > 0 && distPlayer < hearPlayerDist) {
        c.aggro = clamp(c.aggro + dt * 0.55, 0, 1);
        c.alertTarget.copy(player.pos);
      }

      let target = tmpV3.copy(c.pos);
      let speed = 0.75;

      if (c.aggro > 0.02) {
        target.copy(c.alertTarget);
        speed = 2.0 + 7.2 * c.aggro;
      } else {
        const dz = player.pos.z - c.pos.z;

        if (dz > 90) {
          target.z += 130;
          speed = 1.1;
        } else if (dz < -220) {
          target.z += dz * 0.18;
          speed = 1.1;
        } else if (c.cryCd < now - 4) {
          target.x = (Math.random() - 0.5) * 20;
          target.y = (Math.random() - 0.5) * 20;
          target.z += (Math.random() - 0.5) * 40;
          speed = 0.8;
        }
      }

      tmpV.copy(target).sub(c.pos);
      if (tmpV.lengthSq() > 0.01) {
        tmpV.normalize().multiplyScalar(speed);
        c.vel.lerp(tmpV, Math.min(1, dt * 1.9));
      } else {
        c.vel.multiplyScalar(0.96);
      }

      c.pos.addScaledVector(c.vel, dt);

      // Keep inside tube
      clampTube(c.pos, c.radius);

      if (c.pos.z > 0) c.pos.z = 0;
      if (c.pos.z < -LEVEL_LENGTH + 20) c.pos.z = -LEVEL_LENGTH + 20;

      c.mesh.position.copy(c.pos);
      c.mesh.rotation.y += dt * 0.8;

      // Collision
      if (distPlayer < c.radius + PLAYER_RADIUS) {
        if (now > c.hitCd) {
          c.hitCd = now + 1.0;

          tmpV.copy(player.pos).sub(c.pos);
          if (tmpV.lengthSq() < 0.001) tmpV.set(1,0,0);
          tmpV.normalize();

          c.pos.addScaledVector(tmpV, -2.6);
          c.vel.addScaledVector(tmpV, -7.0);

          damage(5.5, "log_rock");
          creatureSound(c.pos, 0.9);
          addLog(t("log_creature"));

          if (!state.playing) return;
        }
      }

      // Vocalizations
      if (c.aggro > 0.32 && now > c.cryCd) {
        c.cryCd = now + 3.5 + Math.random() * 4.0;
        creatureSound(c.pos, c.aggro);

        if (now > c.soundLogCd && now - lastCreatureLog > 7.0) {
          c.soundLogCd = now + 10.0;
          lastCreatureLog = now;
          addLog(t("log_creature"));
        }
      }
    }

    // Depth milestones
    if (state.depth >= nextMilestone && nextMilestone < TARGET_DEPTH) {
      addLog(t("log_depth").replace("{d}", String(nextMilestone)));
      nextMilestone += 500;
    }

    // Autosave
    if (now - lastSave > 5.0) {
      lastSave = now;
      writeSave();
    }
  }

  function updateStats(){
    const info = renderer.info.render;
    dom.stats.textContent = "calls:" + info.calls + " tris:" + info.triangles;
  }

  function onResize(){
    const w = window.innerWidth;
    const h = window.innerHeight;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(w, h);

    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function bindEvents(){
    dom.startBtn.addEventListener("click", e=>{
      e.preventDefault();
      newGame();
    });

    dom.continueBtn.addEventListener("click", e=>{
      e.preventDefault();
      continueGame();
    });

    dom.restartBtn.addEventListener("click", e=>{
      e.preventDefault();
      state.log = [];
      renderLogs();
      newGame();
    });

    dom.menuBtn.addEventListener("click", e=>{
      e.preventDefault();
      showMenu();
    });

    dom.soundBtn.addEventListener("click", e=>{
      e.preventDefault();
      ensureAudio();
      setSound(!state.sound);
    });

    dom.langSelect.addEventListener("change", e=>{
      state.lang = dom.langSelect.value;
      applyLang();
      writeSave();
    });

    dom.pulseBtn.addEventListener("pointerdown", e=>{
      e.preventDefault();
      e.stopPropagation();
      emitPulse();
    });

    dom.pulseBtn.addEventListener("touchstart", e=>{
      e.preventDefault();
      e.stopPropagation();
      emitPulse();
    });

    window.addEventListener("keydown", e=>{
      const code = e.code;

      if (
        code === "ArrowLeft" ||
        code === "ArrowRight" ||
        code === "ArrowUp" ||
        code === "ArrowDown" ||
        code === "Space"
      ) {
        e.preventDefault();
      }

      if (code === "Space") {
        emitPulse();
        return;
      }

      keys[code] = true;
    });

    window.addEventListener("keyup", e=>{
      keys[e.code] = false;
    });

    dom.canvas.addEventListener("pointerdown", e=>{
      if (!state.playing) return;
      if (e.button !== undefined && e.button !== 0) return;

      activePointer = e.pointerId;
      dragOrigin.x = e.clientX;
      dragOrigin.y = e.clientY;

      try { dom.canvas.setPointerCapture(e.pointerId); } catch(err){}

      e.preventDefault();
    });

    dom.canvas.addEventListener("pointermove", e=>{
      if (!state.playing) return;
      if (e.pointerId !== activePointer) return;

      const dx = (e.clientX - dragOrigin.x) / 150;
      const dy = -(e.clientY - dragOrigin.y) / 150;

      input.x = clamp(dx, -1, 1);
      input.y = clamp(dy, -1, 1);
      input.mag = Math.min(1, Math.hypot(input.x, input.y));

      e.preventDefault();
    });

    const endPointer = e=>{
      if (e.pointerId === activePointer) {
        try { dom.canvas.releasePointerCapture(e.pointerId); } catch(err){}
        activePointer = null;
      }

      if (!activePointer) {
        input.x = 0;
        input.y = 0;
        input.mag = 0;
      }
    };

    dom.canvas.addEventListener("pointerup", endPointer);
    dom.canvas.addEventListener("pointercancel", endPointer);
    dom.canvas.addEventListener("lostpointercapture", endPointer);

    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", ()=>{
      setTimeout(onResize, 80);
    });

    window.addEventListener("beforeunload", ()=>{
      writeSave();
    });
  }

  function initThree(){
    try {
      renderer = new THREE.WebGLRenderer({
        canvas: dom.canvas,
        antialias: false,
        powerPreference: "high-performance"
      });
    } catch(e) {
      document.body.innerHTML = "<div style='color:#fff;padding:24px;'>WebGL initialization failed.</div>";
      return;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.00055);

    camera = new THREE.PerspectiveCamera(
      72,
      window.innerWidth / window.innerHeight,
      0.1,
      1800
    );
    camera.position.set(0, 7, 12);

    clock = new THREE.Clock();

    makeShaderMaterial();
    createTunnel();
    createRocks();
    createCreatures();
    createPlayerMesh();
    createPulseVisuals();

    onResize();
    animate();
  }

  function animate(){
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);
    const now = clock.getElapsedTime();

    if (state.playing) {
      updateGame(dt, now);
    }

    uniforms.uTime.value = now;
    updatePulseUniforms(now);

    if (state.playing) updateAudio();

    renderer.render(scene, camera);

    updateStats();
    if (state.playing) updateHUD();
  }

  function init(){
    initDom();
    loadSavedToState();
    setupMenu();
    bindEvents();
    initThree();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
